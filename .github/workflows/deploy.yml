name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Bewusst NICHT abbrechen: seit der Qualitätsschranke dauert der build-Job
  # länger, und ein nachgeschobener Push mit roten Tests würde sonst einen noch
  # laufenden, grünen Lauf abwürgen — dessen deploy-Job liefe nie, der eigene
  # scheitert an den Tests, und live bliebe stumm der Stand von davor. Läufe
  # reihen sich stattdessen auf. (So macht es auch die GitHub-Pages-Vorlage.)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Qualitätsschranke VOR dem Build: schlägt einer dieser Schritte fehl,
      # scheitert der Job und der deploy-Job (needs: build) läuft nicht — eine
      # Änderung mit roten Tests wird also nicht mehr veröffentlicht.
      # Die Tests brauchen keine Secrets: vite.config.ts pinnt sie über test.env
      # fest auf VITE_DATA_BACKEND=mock, sie erreichen die echte Datenbank nie.
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint

      # "npm run build" ist "tsc -b && vite build", prüft also die Typen von src
      # mit — aber tsconfig.app.json schließt Tests und src/test ausdrücklich
      # aus. Ohne diesen Schritt liefe ein Typfehler in src/test/fakeSupabase.ts
      # (der Postgres-Nachbildung, an der die Vertrags-Tests hängen) durch alle
      # drei Befehle hindurch.
      - name: Typen der Testdateien
        run: npx tsc -p tsconfig.test.json --noEmit

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Repo-Variable (kein Secret — die URL ist öffentlich unkritisch,
          # Auth erzwingt die Edge Function selbst). Fehlt sie, bleibt der
          # Transkript-Import auf dem manuellen Gemini-Weg.
          VITE_FUNCTIONS_URL: ${{ vars.VITE_FUNCTIONS_URL }}
          VITE_DATA_BACKEND: supabase
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
