name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Qualitätsschranke VOR dem Build: schlägt einer dieser Schritte fehl,
      # scheitert der Job und der deploy-Job (needs: build) läuft nicht — eine
      # Änderung mit roten Tests wird also nicht mehr veröffentlicht.
      # Die Tests brauchen keine Secrets: vite.config.ts pinnt sie über test.env
      # fest auf VITE_DATA_BACKEND=mock, sie erreichen die echte Datenbank nie.
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint

      # Die Typprüfung läuft hier bewusst nicht separat — "npm run build" ist
      # "tsc -b && vite build" und bricht bei Typfehlern von selbst ab.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DATA_BACKEND: supabase
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
